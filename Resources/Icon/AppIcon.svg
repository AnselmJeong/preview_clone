<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3F5BD9"/>
      <stop offset="0.55" stop-color="#2E2F9E"/>
      <stop offset="1" stop-color="#1B1660"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#8FB4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8FB4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE3F3"/>
      <stop offset="1" stop-color="#C5CCE4"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9D2EC"/>
      <stop offset="1" stop-color="#F4F6FB"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A0838" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- macOS Big Sur+ grid: 824×824 rounded square centered on a 1024 canvas -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- subtle top sheen -->
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>

    <!-- back page -->
    <g transform="rotate(-9 470 560)" filter="url(#shadow)">
      <rect x="282" y="268" width="390" height="500" rx="30" fill="url(#paperBack)"/>
    </g>

    <!-- front page with folded corner -->
    <g transform="rotate(4 540 560)" filter="url(#shadow)">
      <path d="M362 252 H632 L742 362 V776 a30 30 0 0 1 -30 30 H362 a30 30 0 0 1 -30 -30 V282 a30 30 0 0 1 30 -30 Z" fill="url(#paper)"/>
      <path d="M632 252 V332 a30 30 0 0 0 30 30 H742 Z" fill="url(#fold)"/>
      <!-- text lines -->
      <rect x="392" y="330" width="190" height="20" rx="10" fill="#C3CAE0"/>
      <rect x="392" y="408" width="290" height="16" rx="8" fill="#D3D9EA"/>
      <!-- highlighted line -->
      <rect x="380" y="448" width="276" height="40" rx="10" fill="#FFD84D" opacity="0.92"/>
      <rect x="392" y="460" width="250" height="16" rx="8" fill="#9AA3C2"/>
      <rect x="392" y="512" width="300" height="16" rx="8" fill="#D3D9EA"/>
      <rect x="392" y="556" width="270" height="16" rx="8" fill="#D3D9EA"/>
      <rect x="392" y="600" width="290" height="16" rx="8" fill="#D3D9EA"/>
      <rect x="392" y="644" width="200" height="16" rx="8" fill="#D3D9EA"/>
      <rect x="392" y="704" width="130" height="16" rx="8" fill="#E1E5F0"/>
    </g>

    <!-- AI sparkle -->
    <g filter="url(#sparkGlow)" transform="translate(708 300)">
      <path d="M0 -120 C14 -40 40 -14 120 0 C40 14 14 40 0 120 C-14 40 -40 14 -120 0 C-40 -14 -14 -40 0 -120 Z" fill="url(#spark)"/>
      <path d="M118 -96 C123 -72 132 -63 156 -58 C132 -53 123 -44 118 -20 C113 -44 104 -53 80 -58 C104 -63 113 -72 118 -96 Z" fill="#FFF3CC"/>
    </g>
  </g>
  <!-- edge highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
</svg>
